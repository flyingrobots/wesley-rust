[package]
name = "wesley-rust-syntax"
version = "0.1.0"
edition = "2021"
description = "Generic helpers for generating Rust with syn, quote and prettyplease: naming, identifiers, doc attributes and printing"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/flyingrobots/wesley-rust"
homepage = "https://github.com/flyingrobots/wesley-rust#readme"
documentation = "https://docs.rs/wesley-rust-syntax"
keywords = ["codegen", "syn", "prettyplease", "rust"]
categories = ["development-tools"]

[dependencies]
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
